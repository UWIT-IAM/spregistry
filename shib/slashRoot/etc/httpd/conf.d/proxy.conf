# Handling for the proxy server in front of the Grouper container.
# Uses the remoteip_module to use the external client ip (which is passed as a header)
# as the source IP rather than the IP address of the proxy, which can be inconsistent
# when traffic can route through different proxy servers.

<IfModule remoteip_module>
    # This directive identifies the set of proxies that we will trust.
    # This is very broad for now since there is little risk of traffic getting to this container by any other route.
    RemoteIPInternalProxy 10.0.0.0/16
    # This is the http header that contains the external client IP address we want to use.
    RemoteIPHeader X-Forwarded-For
</IfModule>
